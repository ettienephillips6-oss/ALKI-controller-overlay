<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALKI Controller</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="controller">

    <img
      src="./assets/controller-base.png"
      class="controller-image"
      alt="ALKI Controller"
    >

    <div id="button-y" class="input-button button-y"></div>
    <div id="button-x" class="input-button button-x"></div>
    <div id="button-b" class="input-button button-b"></div>
    <div id="button-a" class="input-button button-a"></div>

  </div>

  <div id="status">Press a button on your controller</div>

  <script src="script.js"></script>

</body>
</html>
